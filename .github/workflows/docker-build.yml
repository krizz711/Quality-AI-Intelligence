name: Build and Push Quality AI API Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and Push Image
      run: |
        # Manually runs the exact build targeting your custom file structure
        docker build -t ${{ secrets.DOCKER_USERNAME }}/quality-ai-api:latest -f docker/Dockerfile.api .
        docker push ${{ secrets.DOCKER_USERNAME }}/quality-ai-api:latest
