name: Build and Push Quality AI API Image

on:
  push:
    branches: [ "main" ] # Triggers the build when you commit to your main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the codebase onto the GitHub runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Log in securely to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Set up Docker Buildx (required for complex/multi-stage builds)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Build the core API Dockerfile and push to Docker Hub
    - name: Build and push API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.api # Specifies the template's API Dockerfile path
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/quality-ai-api:latest
